<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>
      Générateur de pass-phrases — mots de passe robustes et mémorisables
    </title>
    <meta
      name="description"
      content="Générateur gratuit de pass-phrases : créez des mots de passe robustes et faciles à retenir, avec options de chiffres, caractères spéciaux et mot personnalisé." />
    <link
      rel="canonical"
      href="https://pass.alsacreations.com/" />

    <link
      rel="icon"
      href="favicon.svg"
      type="image/svg+xml" />
    <link
      rel="mask-icon"
      href="favicon.svg"
      color="#6c5ce7" />
    <meta
      name="theme-color"
      content="#6c5ce7" />

    <meta
      property="og:type"
      content="website" />
    <meta
      property="og:title"
      content="Générateur de pass-phrases" />
    <meta
      property="og:description"
      content="Créez des mots de passe robustes et mémorisables en un clic." />
    <meta
      property="og:url"
      content="https://pass.alsacreations.com/" />
    <meta
      property="og:locale"
      content="fr_FR" />
    <meta
      name="twitter:card"
      content="summary" />
    <meta
      name="twitter:title"
      content="Générateur de pass-phrases" />
    <meta
      name="twitter:description"
      content="Créez des mots de passe robustes et mémorisables en un clic." />

    <link
      rel="stylesheet"
      href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Générateur de pass-phrases",
        "url": "https://pass.alsacreations.com/",
        "description": "Générateur gratuit de pass-phrases : créez des mots de passe robustes et faciles à retenir.",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any",
        "inLanguage": "fr",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <div class="page-grid">
        <section class="card controls">
          <h1>Générateur de pass-phrases</h1>
          <p class="subtitle">
            Générez des mots de passe robustes dont on peut se souvenir&#8239;!
          </p>

          <div class="control-group">
            <label
              class="label-row"
              for="countInput">
              <span id="countLabel">4 mots</span>
            </label>
            <input
              type="range"
              id="countInput"
              min="4"
              max="6"
              value="4"
              step="1" />
          </div>

          <div class="control-group">
            <label class="checkbox-label">
              <input
                type="checkbox"
                id="digitsInput"
                checked />
              <span>Chiffres</span>
            </label>
          </div>

          <div class="control-group">
            <label class="checkbox-label">
              <input
                type="checkbox"
                id="specialInput"
                checked />
              <span>Caractère spécial</span>
            </label>
          </div>

          <details class="control-group advanced">
            <summary>Options avancées</summary>

            <div class="control-group">
              <label
                class="label-row"
                for="customWordInput"
                >Mot personnalisé (optionnel)</label
              >
              <input
                type="text"
                id="customWordInput"
                placeholder="ex. Dragon" />
            </div>

            <div class="control-group">
              <span class="label-row">Genre du mot</span>
              <div class="radio-group">
                <label>
                  <input
                    type="radio"
                    name="customGender"
                    value="m"
                    checked />
                  Masculin
                </label>
                <label>
                  <input
                    type="radio"
                    name="customGender"
                    value="f" />
                  Féminin
                </label>
              </div>
            </div>
          </details>
        </section>

        <section class="card main-phrase">
          <div
            class="phrase-display"
            id="phraseDisplay"></div>
          <div class="phrase-actions">
            <button
              class="btn btn-outline"
              id="copyMainBtn"
              type="button">
              Copier
            </button>
          </div>
          <button
            class="btn btn-primary"
            id="regenerateBtn"
            type="button">
            Générer à nouveau
          </button>
        </section>

        <aside class="card strength">
          <h2>Niveau de sécurité</h2>
          <div
            class="gauge"
            id="gauge">
            <svg
              viewBox="0 0 120 68"
              class="gauge-svg">
              <path
                d="M10,64 A50,50 0 0,1 110,64"
                class="gauge-track" />
              <path
                d="M10,64 A50,50 0 0,1 110,64"
                class="gauge-fill"
                id="gaugeFill" />
            </svg>
            <span
              class="gauge-label"
              id="gaugeLabel"
              >fort</span
            >
          </div>
          <p
            class="strength-time"
            id="strengthTime"></p>
        </aside>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
